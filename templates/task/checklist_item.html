<div class="check-row">
  <label class="check-item">
    <input type="checkbox" class="form-check-input" data-toggle-check="{{ item.id }}" {% if item.is_completed %}checked{% endif %} {% if not can_update %}disabled{% endif %}>
    <span>{{ item.title }}</span>
  </label>
  {% if can_update %}
    <button type="button" class="btn btn-light btn-sm btn-icon text-danger" data-delete-check="{% url 'tasks:ajax_checklist_delete' item.id %}" title="Xóa hạng mục" aria-label="Xóa hạng mục {{ item.title }}">
      <i class="bi bi-trash" aria-hidden="true"></i>
    </button>
  {% endif %}
</div>
