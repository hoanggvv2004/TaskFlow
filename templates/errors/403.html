{% extends "base_auth.html" %}
{% block title %}403{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="stat-icon tone-danger mx-auto mb-3" style="width:64px;height:64px;font-size:28px;border-radius:20px"><i class="bi bi-shield-lock"></i></div>
    <div class="error-code">403</div>
    <h1 style="font-size:20px;font-weight:600">Bạn không có quyền truy cập</h1>
    <p class="text-muted">Trang này yêu cầu quyền cao hơn hoặc bạn không thuộc dự án liên quan. Hãy liên hệ Project Manager nếu cần quyền truy cập.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a class="btn btn-light" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Quay lại</a>
      <a class="btn btn-primary" href="/"><i class="bi bi-house-door"></i> Về trang chủ</a>
    </div>
  </div>
</div>
{% endblock %}
