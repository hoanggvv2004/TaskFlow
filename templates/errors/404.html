{% extends "base_auth.html" %}
{% block title %}404{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-card">
    <div class="stat-icon tone-primary mx-auto mb-3" style="width:64px;height:64px;font-size:28px;border-radius:20px"><i class="bi bi-compass"></i></div>
    <div class="error-code">404</div>
    <h1 style="font-size:20px;font-weight:600">Không tìm thấy trang</h1>
    <p class="text-muted">Liên kết có thể đã bị đổi, dự án hoặc nhiệm vụ đã được lưu trữ.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a class="btn btn-light" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Quay lại</a>
      <a class="btn btn-primary" href="/"><i class="bi bi-house-door"></i> Về trang chủ</a>
    </div>
  </div>
</div>
{% endblock %}
