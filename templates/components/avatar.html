{% if user.avatar %}<img class="avatar" src="{{ user.avatar.url }}" alt="{{ user.get_display_name }}" title="{{ user.get_display_name }}" width="{{ size }}" height="{{ size }}" style="width:{{ size }}px;height:{{ size }}px">{% else %}<span class="avatar-fallback" title="{{ user.get_display_name }}" style="width:{{ size }}px;height:{{ size }}px">{{ user.get_initials }}</span>{% endif %}
